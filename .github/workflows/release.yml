on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write

env:
    GIT_AUTHOR_NAME: '@bao-bot'
    GIT_AUTHOR_EMAIL: 'apps@baosystems.com'
    GIT_COMMITTER_NAME: '@bao-bot'
    GIT_COMMITTER_EMAIL: 'apps@baosystems.com'
    GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{env.GH_TOKEN}}
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                  token: ${{env.GH_TOKEN}}
            - uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: 'yarn'
            - run: yarn install --frozen-lockfile
            - name: Build
              run: yarn build
            - name: Test
              run: yarn test
            - run: yarn install --frozen-lockfile
            - uses: dhis2/action-semantic-release@master
              with:
                  publish-github: true
                  github-token: ${{ env.GH_TOKEN }}
        env:
            CI: true